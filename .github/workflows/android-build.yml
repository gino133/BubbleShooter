name: Build Android APK

on:
  # Tự động chạy khi bạn push code lên nhánh chính
  push:
    branches: [ "main", "master" ]
  # Cho phép bạn chạy thủ công từ tab Actions trên GitHub
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Tải code của bạn về máy ảo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Cài đặt Java, cần thiết để build Android [citation:5][citation:9]
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Cấp quyền thực thi cho file gradlew (quan trọng trên Linux/macOS) [citation:3][citation:5]
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 4. Lưu bộ nhớ cache cho Gradle để lần build sau nhanh hơn [citation:3][citation:5]
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 5. Chạy lệnh build APK Debug [citation:8][citation:9][citation:11]
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 6. Tải file APK lên để bạn tải về [citation:5][citation:9]
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7 # Lưu file trong 7 ngày
